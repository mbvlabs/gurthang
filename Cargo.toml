[workspace]
members = [
    "crates/gurthang",
    "crates/gurthang-cli",
    "crates/gurthang-project",
    "crates/gurthang-new",
    "crates/gurthang-run",
    "crates/gurthang-generate",
    "crates/gurthang-db",
    "crates/gurthang-build",
    "crates/gurthang-inertia",
    "crates/gurthang-jobs",
    "crates/gurthang-http",
    "crates/gurthang-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mbvlabs/gurthang"

[workspace.dependencies]
askama = "0.16"
async-trait = "0.1"
axum = "0.8"
axum-login = "0.18"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dotenvy = "0.15"
gurthang = { path = "crates/gurthang" }
heck = "0.5"
include_dir = "0.7"
mime_guess = "2"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = "0.3"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
tower = "0.5"
futures-util = "0.3"
tower-http = { version = "0.6", features = [
    "fs",
    "trace",
    "catch-panic",
    "cors",
    "compression-gzip",
    "timeout",
    "limit",
    "set-header",
    "util",
    "add-extension",
] }
tower-sessions = "=0.14.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
tempfile = "3.20"
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
