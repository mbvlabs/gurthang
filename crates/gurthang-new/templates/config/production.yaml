server:
  host: 0.0.0.0
  port: 3000
  url: http://127.0.0.1:3000
  middlewares:
    catch_panic:
      enable: true
    etag:
      enable: true
    logger:
      enable: true
    request_id:
      enable: true
    remote_ip:
      enable: true
    csrf:
      enable: true
    session_auth:
      enable: true
    telemetry:
      enable: true
    timeout_request:
      enable: true
      timeout: 30000
    rate_limit:
      enable: true
      max_requests: 100
      window_ms: 1000
    authn:
      enable: true
      public_paths:
        - /
        - /login
        - /register
        - /assets
      redirect: /login
      status: 401
    static:
      enable: true
      must_exist: false
      folder:
        uri: /assets
        path: assets
    fallback:
      enable: false
session:
  secure: true
  cookie: gurthang.sid
inertia:
  ssr_runtime: node
  ssr_timeout_ms: 5000
workers:
  concurrency: 8
  poll_interval_ms: 1000
  lease_seconds: 300
  timeout_seconds: 240
logger:
  level: info
mailer:
  stub: false
  smtp:
    enable: true
    host: localhost
    port: 587
    secure: true
