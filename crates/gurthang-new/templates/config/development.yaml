server:
  host: 127.0.0.1
  port: 3000
  url: http://127.0.0.1:3000
  middlewares:
    catch_panic:
      enable: true
    etag:
      enable: true
    logger:
      enable: true
    request_id:
      enable: true
    csrf:
      enable: true
    session_auth:
      enable: true
    static:
      enable: true
      must_exist: false
      folder:
        uri: /assets
        path: assets
session:
  secure: false
  cookie: gurthang.sid
inertia:
  vite_dev_server_url: http://127.0.0.1:5173
  ssr_runtime: node
  ssr_timeout_ms: 5000
workers:
  concurrency: 4
  poll_interval_ms: 1000
  lease_seconds: 300
  timeout_seconds: 240
logger:
  level: info
mailer:
  stub: true
